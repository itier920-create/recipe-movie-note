# 本番用の構成：MySQL → マイグレーション → アプリ → HTTPS の受付係（Caddy）の順に起動する
# 起動方法：docker compose -f compose.prod.yml --env-file .env.production up -d --build

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # メモリ1GBのサーバーで動かすため、MySQL の使用メモリを抑える
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD を .env.production に設定してください}
      MYSQL_DATABASE: recipe_movie_note
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD を .env.production に設定してください}
      TZ: Asia/Tokyo
    volumes:
      - db-data:/var/lib/mysql
    # DB が接続を受け付けられる状態になったかを確認する
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 外からは直接つながせない（アプリからだけ使う）

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: mysql://app:${MYSQL_PASSWORD}@db:3306/recipe_movie_note
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.production
    environment:
      # allowPublicKeyRetrieval=true：MySQL の再起動直後でも、アプリが DB に接続できるようにする
      DATABASE_URL: mysql://app:${MYSQL_PASSWORD}@db:3306/recipe_movie_note?allowPublicKeyRetrieval=true
    depends_on:
      migrate:
        condition: service_completed_successfully
    # 外からは直接つながせない（Caddy からだけ使う）

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 取得した証明書を保存する（消えると再取得になる）
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
