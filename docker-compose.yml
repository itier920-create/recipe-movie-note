# 開発用の MySQL（本番用の設定は第2週に別途用意する）
services:
  db:
    image: mysql:8.4
    container_name: recipe-movie-note-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: recipe_movie_note
      MYSQL_USER: app
      MYSQL_PASSWORD: apppassword
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db-data:
